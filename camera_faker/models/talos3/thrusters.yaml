# Optional visual animation, driven by realized forces (newtons), not commands.
# Full-speed RPM estimate from the vehicle's existing force calibration.
# Pivot/axis and mesh vertices use the CAD/model origin, in metres.
# Pivots follow the CAD hub cylinders, not the rounded force application points.
topic: simulator/actual_thruster_forces
timeout: 0.5
force_deadband: 0.01
speed_scale: 1.0 # 1 = real-time estimated RPM; no display speed cap.
# Source: riptide_descriptions2/config/talos.yaml, thruster_solver.force_to_rpm_coefficents.
# Signed RPM = c0 + c1*F + c2*tanh(F) + c3*abs(F)^0.25, F in newtons.
# Separate signed forward/reverse fits; clamped to zero if the fit crosses sign near idle.
force_to_rpm:
  forward: [-475.886186, 32.327429, -324.744664, 1443.832105]
  reverse: [257.460623, 42.948545, -24.402056, -986.338071]
