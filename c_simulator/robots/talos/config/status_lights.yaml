# Visual estimate from the supplied Talos photograph and CAD hull bounds.
# Coordinates are in the robot model/origin frame (metres, radians).
# Three LED bars sit beneath the clear top of the port (+Y) central hull.
input:
  type: riptide_msgs2/msg/LedCommand
  topic: command/led
# Short detection pulse, then resume the underlying status command.
flash_duration: 0.15
lights:
  - id: port_hull_aft
    target_mask: 2  # ALU board; accepts TARGET_ALU and TARGET_ALL
    pose: [-0.181, 0.1573, 0.094, 0, 0, 0]
    size: [0.012, 0.055, 0.003]
    radiance: 240  # Four times the task magnet LEDs; drives stronger HDR bloom.
  - id: port_hull_middle
    target_mask: 2
    pose: [-0.143, 0.1573, 0.094, 0, 0, 0]
    size: [0.012, 0.055, 0.003]
    radiance: 240
  - id: port_hull_fore
    target_mask: 2
    pose: [-0.105, 0.1573, 0.094, 0, 0, 0]
    size: [0.012, 0.055, 0.003]
    radiance: 240
